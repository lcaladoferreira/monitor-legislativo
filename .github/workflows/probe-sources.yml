name: Sonda de fontes oficiais (diagnóstico)

# Diagnóstico manual: consulta candidatos a endpoint oficial de cada órgão
# (ANPD, CNJ, TSE, DOU, Planalto, MCTI) e publica o resultado (resumo + amostras
# dos corpos) no próprio branch, além do artifact. Não grava dataset, não
# altera o site. Serve para comprovar, com evidência real, qual fonte
# estruturada cada coletor usa.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - ".github/probe-trigger"
      - "scripts/probe_sources.py"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Sondar endpoints
        run: |
          mkdir -p out
          ARGS=()
          if [ -n "${{ inputs.orgao }}" ]; then
            for o in ${{ inputs.orgao }}; do ARGS+=(--orgao "$o"); done
          fi
          python3 scripts/probe_sources.py --exemplos --limite-exemplo 600 \
            --salvar-dir out/probe "${ARGS[@]}" > out/probe.log 2>&1 || true
          tail -c 4000 out/probe.log
          echo "## Sonda de fontes oficiais" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(=== |    status=)" out/probe.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar corpos coletados (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: out/probe
          retention-days: 7
      - name: Publicar a sonda no branch (mesmo padrão do workflow de produção)
        if: always()
        run: |
          git config user.name "monitor-legislativo-bot"
          git config user.email "monitor-legislativo-bot@users.noreply.github.com"
          git add -A out/probe out/probe.log
          if git diff --cached --quiet; then
            echo "Sonda sem alterações a publicar."
          else
            git commit -m "chore(diag): sonda de fontes oficiais"
            git push origin HEAD:${{ github.ref_name }}
          fi

