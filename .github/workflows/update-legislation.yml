name: Atualizar monitoramento legislativo

# Coleta automática das fontes oficiais (Câmara/Senado), rebuild do site
# estático e validação. Commita somente quando há alteração real no dataset
# ou nas páginas geradas. O deploy na Vercel é acionado pelo push (a Vercel
# executa `python3 scripts/build_site.py` e publica `docs/`).
#
# A coleta publica resultados parciais quando build e validação passam.
# Falhas de build nunca publicam páginas quebradas; o dataset fica em artifact.
# A coleta pública não depende de banco, SMTP ou credenciais comerciais.
on:
  schedule:
    # SLA alvo de 2 horas exige coleta mais frequente do que quatro vezes/dia.
    # Horário UTC: todo início de hora no minuto 17, fora do pico do minuto 0.
    # Agendamento do GitHub é best effort: isto reduz o intervalo planejado,
    # mas não garante SLA em caso de atraso, indisponibilidade ou fila.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      orcamento_minutos:
        description: "Teto de duração da coleta, em minutos (padrão: 25)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-legislation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # Orçamento da coleta: mantém coleta + build + validação + commit dentro do
  # timeout do job. Ao estourar, o coletor grava o que verificou, marca a
  # execução como "parcial" e o site é publicado do mesmo jeito.
  MONITOR_BUDGET_SEGUNDOS: "1500"   # 25 min
  MONITOR_MAX_NOVAS: "25"           # fichas novas detalhadas por execução

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Coletar dados oficiais
        id: coleta
        # A coleta pode ser parcial (orçamento) ou falhar: o objetivo é publicar
        # o dataset verificado e sinalizar o problema no fim do job.
        continue-on-error: true
        timeout-minutes: 40
        env:
          ORCAMENTO_MINUTOS: ${{ inputs.orcamento_minutos }}
        run: |
          ARGS=()
          if [ -n "${ORCAMENTO_MINUTOS}" ]; then
            ARGS=(--budget-min "${ORCAMENTO_MINUTOS}")
          fi
          python3 scripts/update_legislation.py "${ARGS[@]}"

      - name: Editorial — classificar mudanças e criar/atualizar artigos
        id: editorial
        if: always()
        # Camada editorial independente: lê o dataset já gravado, processa cada
        # mudança uma única vez (máx. 1 artigo novo/dia; atualizações ilimitadas)
        # e grava apenas em data/articles/. Falha aqui NUNCA corrompe o dataset
        # legislativo nem impede o rebuild/commit do monitor.
        continue-on-error: true
        run: python3 scripts/generate_articles.py

      - name: Rebuild do site
        id: build
        if: always()
        run: python3 scripts/build_site.py

      - name: Validar dataset e páginas
        id: validate
        if: always()
        run: python3 scripts/validate_site.py

      - name: Verificar regressões da auditoria regulatória
        id: audit
        if: always()
        run: python3 tests/test_audit_watchlist.py

      - name: Resumo da execução
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/legislation/updates.json")
          if not p.exists():
              print("Sem updates.json"); raise SystemExit(0)
          ups = json.loads(p.read_text(encoding="utf-8"))
          ex = (ups.get("execucoes") or [{}])[0]
          http = ex.get("http") or {}
          linhas = [
              "## Monitoramento legislativo — execução do dia",
              "",
              f"- **Status:** `{ex.get('status', '—')}`",
              f"- **Início/fim:** {ex.get('data_hora', '—')} → {ex.get('fim', '—')}",
              f"- **Duração:** {ex.get('duracao_segundos', '—')}s de {ex.get('orcamento_segundos', '—')}s de orçamento",
              f"- **Proposições:** {ex.get('proposicoes_verificadas', '—')} verificadas de "
              f"{ex.get('proposicoes_monitoradas', '—')} monitoradas "
              f"({ex.get('cobertura_pct', '—')}% de cobertura; "
              f"{ex.get('proposicoes_pendentes', 0)} pendentes)",
              f"- **Mudanças:** {ex.get('mudancas_detectadas', '—')} · "
              f"**novas proposições:** {ex.get('novas_proposicoes', '—')} · "
              f"**eventos:** {ex.get('eventos_adicionados', '—')}",
              f"- **HTTP:** {http.get('chamadas', '—')} chamadas · "
              f"{http.get('cache', 0)} do cache · {http.get('falhas', 0)} falhas · "
              f"{http.get('tempo_total', '—')}s em rede",
              f"- **Erros:** {len(ex.get('erros') or [])}",
              f"- **Status global (multiórgão):** `{ex.get('status_global', '—')}`",
          ]
          art_path = pathlib.Path("data/articles/editorial_state.json")
          if art_path.exists():
              try:
                  st = json.loads(art_path.read_text(encoding="utf-8"))
                  ex_ed = (st.get("execucoes") or [{}])[0]
                  arts = json.loads(pathlib.Path("data/articles/articles.json")
                                    .read_text(encoding="utf-8"))
                  n_art = len(arts.get("artigos", []))
                  print("")
                  print(f"- **Editorial (/artigos/):** {n_art} artigo(s) publicado(s) · "
                        f"{ex_ed.get('novos_artigos', 0)} novo(s) nesta execução · "
                        f"{ex_ed.get('artigos_atualizados', 0)} atualização(ões) · "
                        f"{ex_ed.get('ignoradas', 0)} mudança(s) sem ação editorial · "
                        f"{ex_ed.get('aguardando_curadoria', 0)} aguardando curadoria")
              except Exception as e:
                  print(f"- **Editorial (/artigos/):** estado não lido ({e})")
          fm = ex.get("fontes_monitoradas") or {}
          if fm:
              linhas += ["", "| órgão | status | itens consultados | novidades | erros |",
                         "|---|---|---|---|---|"]
              for orgao, f in fm.items():
                  linhas.append(f"| {orgao} | {f.get('status', '—')} | "
                                f"{f.get('itens_consultados', '—')} | "
                                f"{f.get('novidades', '—')} | {f.get('erros', 0)} |")
          falhas = ex.get("fontes_falha") or []
          if falhas:
              linhas.append("")
              linhas.append("**Fontes com falha nesta execução:** "
                            + ", ".join(falhas))
          print("\n".join(linhas))
          PY

      - name: Detectar mudanças reais
        id: diff
        if: always()
        run: |
          if git status --porcelain | grep .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push (somente se houver alteração)
        if: always() && steps.diff.outputs.changed == 'true' && steps.build.outcome == 'success' && steps.validate.outcome == 'success' && steps.audit.outcome == 'success'
        run: |
          git config user.name "monitor-legislativo-bot"
          git config user.email "monitor-legislativo-bot@users.noreply.github.com"
          git add -A data docs
          # Evita commit vazio em caso de corrida: só commita se houver staged diff
          if git diff --cached --quiet; then
            echo "Nenhuma alteração real. Nada a commitar."
          else
            DATA=$(date -u +%Y-%m-%d)
            STATUS=$(python3 -c "import json;print((json.load(open('data/legislation/updates.json')).get('execucoes') or [{}])[0].get('status','?'))")
            MSG_EDITORIAL="Sem ação editorial nesta execução."
            if [ -f data/articles/editorial_state.json ]; then
              # UMA LINHA SÓ: python multilinha colado na coluna 0 quebra o YAML
              # do workflow e o GitHub para de agendar o cron (incidente 2026-09-18).
              MSG_EDITORIAL=$(python3 -c "import json;st=json.load(open('data/articles/editorial_state.json'));ex=(st.get('execucoes') or [{}])[0];print(f\"Editorial: {ex.get('novos_artigos',0)} artigo(s) novo(s), {ex.get('artigos_atualizados',0)} atualização(ões), {ex.get('ignoradas',0)} ignorada(s).\")")
            fi
            git commit -m "chore: atualização automática do monitoramento ($DATA) [$STATUS]" -m "Execução do coletor (update_legislation.py) + camada editorial (generate_articles.py) + rebuild (build_site.py). $MSG_EDITORIAL Mudanças e métricas em data/legislation/updates.json — painel em /monitoramento/; log editorial em data/articles/editorial_state.json."
            git push
          fi

      - name: Conferir saúde da coleta publicada
        if: always() && steps.build.outcome == 'success' && steps.validate.outcome == 'success' && steps.audit.outcome == 'success'
        run: python3 scripts/check_collection.py

      - name: Preservar dados coletados em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/legislation/*.json
          retention-days: 14

      - name: Sinalizar coleta incompleta (após tentativa de publicação)
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::A coleta não terminou com sucesso. Consulte as etapas de build e commit para confirmar a publicação — verifique o painel /monitoramento/ e os logs da etapa 'Coletar dados oficiais'."
          exit 1

